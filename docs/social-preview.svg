<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AWS Serverless Sentiment Lab</title>
  <desc id="desc">Recruiter social preview showing API Gateway, Lambda, CloudWatch, Terraform, and protected CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#10233f"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy=".18" r=".72"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".28"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/><rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="1110" cy="105" r="145" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="2"/><circle cx="1110" cy="105" r="105" fill="none" stroke="#a78bfa" stroke-opacity=".22" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="70" width="238" height="42" rx="21" fill="#0e7490"/><text x="191" y="98" text-anchor="middle" fill="#ecfeff" font-size="18" font-weight="700">AWS + TERRAFORM LAB</text>
    <text x="72" y="190" fill="#f8fafc" font-size="56" font-weight="800">Serverless Sentiment API</text><text x="72" y="242" fill="#94a3b8" font-size="25">Bounded inputs. Least privilege. Reproducible delivery.</text>
    <g filter="url(#shadow)">
      <rect x="72" y="330" width="238" height="116" rx="18" fill="#132b46" stroke="#f59e0b" stroke-width="2"/><text x="191" y="378" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="700">API GATEWAY</text><text x="191" y="414" text-anchor="middle" fill="#cbd5e1" font-size="17">POST /predict</text>
      <rect x="355" y="330" width="238" height="116" rx="18" fill="#132b46" stroke="#a78bfa" stroke-width="2"/><text x="474" y="378" text-anchor="middle" fill="#c4b5fd" font-size="20" font-weight="700">PYTHON LAMBDA</text><text x="474" y="414" text-anchor="middle" fill="#cbd5e1" font-size="17">Keyword evidence</text>
      <rect x="638" y="330" width="238" height="116" rx="18" fill="#132b46" stroke="#22c55e" stroke-width="2"/><text x="757" y="378" text-anchor="middle" fill="#86efac" font-size="20" font-weight="700">CLOUDWATCH</text><text x="757" y="414" text-anchor="middle" fill="#cbd5e1" font-size="17">14-day retention</text>
      <rect x="921" y="330" width="286" height="116" rx="18" fill="#132b46" stroke="#06b6d4" stroke-width="2"/><text x="1064" y="378" text-anchor="middle" fill="#67e8f9" font-size="20" font-weight="700">PROTECTED DELIVERY</text><text x="1064" y="414" text-anchor="middle" fill="#cbd5e1" font-size="17">Tests · Terraform · CodeQL</text>
    </g>
    <rect x="72" y="518" width="1135" height="1" fill="#334155"/><text x="72" y="570" fill="#e2e8f0" font-size="20" font-weight="700">Transparent heuristic — no unsupported ML or deployment claim</text><text x="72" y="603" fill="#64748b" font-size="17">Educational serverless architecture and infrastructure-as-code reference</text>
  </g>
</svg>
