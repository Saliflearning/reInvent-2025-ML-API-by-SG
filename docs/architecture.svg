<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AWS Serverless Sentiment Lab architecture</title>
  <desc id="desc">Terraform validated by GitHub CI provisions API Gateway, a Python Lambda keyword classifier, and CloudWatch logging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="64" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">AWS Serverless Sentiment Lab</text>
  <text x="64" y="116" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Bounded requests · least-privilege logs · deterministic evidence · no ML claim</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="65" y="235" width="210" height="130" rx="18" fill="#132b46" stroke="#38bdf8" stroke-width="2"/>
    <text x="170" y="286" text-anchor="middle" fill="#7dd3fc" font-size="19" font-weight="700">CLIENT</text><text x="170" y="322" text-anchor="middle" fill="#e2e8f0" font-size="17">POST /predict</text>
    <rect x="355" y="235" width="210" height="130" rx="18" fill="#132b46" stroke="#f59e0b" stroke-width="2"/>
    <text x="460" y="286" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="700">API GATEWAY</text><text x="460" y="322" text-anchor="middle" fill="#e2e8f0" font-size="17">HTTP API + throttling</text>
    <rect x="645" y="205" width="240" height="190" rx="18" fill="#132b46" stroke="#a78bfa" stroke-width="2"/>
    <text x="765" y="260" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">PYTHON LAMBDA</text><text x="765" y="299" text-anchor="middle" fill="#e2e8f0" font-size="16">Input boundary</text><text x="765" y="328" text-anchor="middle" fill="#e2e8f0" font-size="16">Keyword heuristic</text><text x="765" y="357" text-anchor="middle" fill="#e2e8f0" font-size="16">Stable JSON errors</text>
    <rect x="965" y="235" width="175" height="130" rx="18" fill="#132b46" stroke="#22c55e" stroke-width="2"/>
    <text x="1052" y="286" text-anchor="middle" fill="#86efac" font-size="18" font-weight="700">CLOUDWATCH</text><text x="1052" y="322" text-anchor="middle" fill="#e2e8f0" font-size="16">14-day retention</text>
    <rect x="260" y="480" width="270" height="105" rx="18" fill="#0f2138" stroke="#8b5cf6" stroke-width="2"/>
    <text x="395" y="524" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">TERRAFORM</text><text x="395" y="554" text-anchor="middle" fill="#cbd5e1" font-size="16">Package + provision + scope</text>
    <rect x="670" y="480" width="270" height="105" rx="18" fill="#0f2138" stroke="#06b6d4" stroke-width="2"/>
    <text x="805" y="524" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">PROTECTED CI</text><text x="805" y="554" text-anchor="middle" fill="#cbd5e1" font-size="16">Test + validate + scan</text>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"><path d="M275 300 H345"/><path d="M565 300 H635"/><path d="M885 300 H955"/><path d="M465 480 C520 430 610 410 690 390"/><path d="M670 530 H540"/></g>
  <text x="64" y="620" fill="#64748b" font-family="Arial, sans-serif" font-size="15">Educational infrastructure-as-code reference · validation only · no live endpoint advertised</text>
</svg>
