name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/repository_safety.py --self-test
      - run: python scripts/repository_safety.py --current
      - run: python scripts/repository_safety.py --history

  python:
    name: Python Tests and Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
      - run: ruff check lambda tests scripts
      - run: python -m compileall -q lambda tests scripts
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  terraform:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
